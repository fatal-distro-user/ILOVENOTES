appId: app.ilovenotes.desktop
productName: ILOVENOTES
copyright: Copyright © ILOVENOTES
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - package.json
asar: true
fileAssociations:
  - ext: ilovenotes
    name: ILOVENOTES Workspace
    mimeType: application/x-ilovenotes
linux:
  syncDesktopName: true
  target: [AppImage, deb]
  category: Office
  icon: build/icon.png
  maintainer: ILOVENOTES <maintainers@ilovenotes.app>
  synopsis: Local-first notes, canvas, PDF and paint studio
deb:
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0]
win:
  target: [nsis]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  target: [dmg]
  category: public.app-category.productivity
  icon: build/icon.png
  identity: null
publish: null
